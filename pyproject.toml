[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdb_format_detector"
version = "1.0.0"
description = "Automatically detect the format of a macromolecular structure file (legacy PDB, PDBx/mmCIF, or binary CIF)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Fotis Baltoumas" },
]
dependencies = [
    "biopython>=1.88",
    "numpy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/fbaltoumas/pdb-format-detector"

[project.scripts]
pdb-format-detector = "pdb_format_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
